server {
    listen 8000;
    listen [::]:8000;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 100M;
    charset utf-8;

    # Security headers (API + static). Enable HSTS when clients use HTTPS end-to-end.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-XSS-Protection "1; mode=block" always;
    # Do not set a global CSP here — it breaks Laravel welcome/error pages and static assets.
    # API routes return JSON; the SPA is served from the frontend container (:5173).

    # Railway healthcheck must not wait on PHP/Laravel boot (otherwise: service unavailable).
    location = /api/health {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 200 '{"ok":true}';
    }

    location /api {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /sanctum {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /storage {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /up {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Docker Compose: public hostname hits Laravel. Proxy the SPA; keep API on this container.
    # Railway has no `frontend` service — /api still works; `/` is unused on the API host.
    resolver 127.0.0.11 valid=10s ipv6=off;
    location / {
        set $spa http://frontend:5173;
        proxy_pass $spa;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
