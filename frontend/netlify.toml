[build]
  command = "npm run build"
  publish = "dist"

# Same-origin API proxy → Render (must win over SPA /* fallback).
[[redirects]]
  from = "/api/*"
  to = "https://fitandsleek-official-production.up.railway.app/api/:splat"
  status = 200
  force = true

# SPA: React Router paths must fall back to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
